<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="modernYellowGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFEB3B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFC107;stop-opacity:1" />
    </linearGradient>
    
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0" dy="1"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g transform="translate(0, -10)">
    <rect x="246" y="380" width="20" height="45" fill="#90A4AE"/>
    <rect x="206" y="415" width="100" height="20" rx="10" fill="#90A4AE"/>
    
    <circle cx="256" cy="425" r="28" fill="#00C853"/>
  </g>

  <g transform="translate(0, -20)">
    <path d="M40 100 L200 100 L230 130 L472 130 A20 20 0 0 1 492 150 L492 370 A20 20 0 0 1 472 390 L40 390 A20 20 0 0 1 20 370 L20 120 A20 20 0 0 1 40 100 Z" fill="#FBC02D"/>
    
    <rect x="20" y="140" width="472" height="250" rx="16" fill="url(#modernYellowGradient)" filter="url(#softShadow)"/>
  </g>

  <text x="50%" y="295" 
        font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-weight="800" 
        font-size="110" 
        text-anchor="middle" 
        fill="#263238"
        style="letter-spacing: -1px;">
    SFTPGo
  </text>
</svg>
